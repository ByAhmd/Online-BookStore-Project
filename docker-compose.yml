# Local BookWise store with simulated payments (see docs/DEPLOYMENT.md):
#
#     docker compose up --build        then open http://localhost:8080
#     docker compose down              stop (add -v to also delete the data)
#
# Everything here is for LOCAL USE ONLY: the passwords below are public
# placeholders. Do not reuse them anywhere else.
#
# To present the store from this computer through a tunnel such as Tailscale
# Funnel, start it with its public address and an administrator password of
# your own (the container refuses the placeholder on a public address):
#
#     BOOKWISE_APP_URL=https://<machine>.<tailnet>.ts.net \
#     BOOKWISE_ADMIN_PASSWORD='<a password of your own>' docker compose up -d

name: bookwise

services:
  db:
    # MySQL 8.4 LTS, as in CI (MySQL 8.0 reached its end of life in April 2026).
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: bookwise
      MYSQL_USER: bookwise
      MYSQL_PASSWORD: bookwise-local-only
      MYSQL_ROOT_PASSWORD: root-local-only
    healthcheck:
      # 127.0.0.1 forces TCP, so the check only passes once initialisation is complete.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  app:
    build: .
    image: bookwise:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only this computer can open the store (127.0.0.1, not every network
      # interface): the administrator password below is public. Tailscale
      # Funnel forwards to 127.0.0.1:8080 as well.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      # The address browsers use; payments return there.
      APP_URL: ${BOOKWISE_APP_URL:-http://localhost:8080}
      APP_ENV: local
      APP_DEBUG: "false"
      # Demo mode: banner, and the built-in payment simulator takes every
      # payment (pay.php; no Stripe account needed, no real payments).
      APP_DEMO: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
      # Emails are kept in the database instead of being sent, as on the
      # public demo, and shown on the demo inbox page (inbox.php, the "Inbox"
      # link in the header): each browser sees its own accounts' emails.
      MAIL_DRIVER: database
      STRIPE_CURRENCY: sar
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: bookwise
      DB_USER: bookwise
      DB_PASS: bookwise-local-only
      # Local-only administrator, created on start-up. Do NOT reuse these
      # values on a public site: set BOOKWISE_ADMIN_PASSWORD (see above).
      BOOKWISE_ADMIN_EMAIL: admin@bookwise.test
      BOOKWISE_ADMIN_PASSWORD: ${BOOKWISE_ADMIN_PASSWORD:-local-admin-password}
    volumes:
      # Uploaded images (public/uploads) survive container rebuilds.
      - uploads:/var/www/bookwise/public/uploads
    restart: unless-stopped

volumes:
  db-data:
  uploads:
