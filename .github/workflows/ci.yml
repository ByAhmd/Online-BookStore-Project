name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bookwise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: bookwise_test
      DB_USER: root
      DB_PASS: root
      # Database-backed suites must fail, not skip, if MySQL is unreachable.
      BOOKWISE_REQUIRE_DB: 1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: PHP syntax check
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          for script in docker/entrypoint.sh tests/Docker/smoke.sh tests/Docker/entrypoint_test.sh; do
            bash -n "$script"
          done
          shellcheck --severity=warning docker/entrypoint.sh tests/Docker/smoke.sh tests/Docker/entrypoint_test.sh

      - name: Entrypoint configuration tests
        run: bash tests/Docker/entrypoint_test.sh

      - name: Build the image
        run: docker compose build

      - name: Start the store (MySQL + app in demo mode)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Wait for /health.php
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health.php; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "/health.php did not answer in time" >&2
          exit 1

      - name: The app runs as www-data
        run: test "$(docker compose exec -T app id -un)" = www-data

      - name: Smoke test
        env:
          BASE_URL: http://localhost:8080
        run: bash tests/Docker/smoke.sh

      - name: The order is stored as paid
        run: |
          status="$(docker compose exec -T db mysql -N -u bookwise -pbookwise-local-only bookwise \
            -e "SELECT status FROM orders ORDER BY id DESC LIMIT 1")"
          echo "latest order: $status"
          test "$status" = paid

      - name: The payment was simulated inside the application
        run: |
          # The in-process simulator keeps its state in storage/, writable by www-data.
          docker compose exec -T app sh -c 'test "$(stat -c %U storage/payment-simulator.json)" = www-data'
          docker compose exec -T app grep -q '"payment_status": "paid"' storage/payment-simulator.json

      - name: The local-only administrator password is refused on a public address
        run: |
          if output="$(docker compose run --rm --no-deps -T -e APP_URL=https://bookwise.example.com app 2>&1)"; then
            echo "the container started with the published administrator password on a public address" >&2
            exit 1
          fi
          echo "$output"
          grep -q 'not a local address' <<<"$output"

      - name: Without APP_DEMO there is no payment simulator (and PORT is honoured)
        run: |
          docker compose run -d --no-deps --name bookwise-real -p 8081:9090 \
            -e PORT=9090 -e APP_DEMO=false -e APP_URL=http://localhost:8081 \
            -e STRIPE_SECRET_KEY=sk_test_not_a_real_key -e BOOKWISE_ADMIN_EMAIL= -e BOOKWISE_ADMIN_PASSWORD= \
            app
          for attempt in $(seq 1 60); do
            curl -fsS --max-time 5 http://localhost:8081/health.php && break
            sleep 2
          done
          echo
          curl -fsS --max-time 5 http://localhost:8081/health.php
          echo
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 'http://localhost:8081/pay.php?session=cs_test_x')"
          echo "pay.php without APP_DEMO: HTTP $code"
          test "$code" = 404
          if curl -s --max-time 5 http://localhost:8081/Home_Page.php | grep -q 'demo-banner'; then
            echo "the demo banner must not be shown without APP_DEMO" >&2
            exit 1
          fi

      - name: /health.php reports an unavailable database
        run: |
          docker compose stop db
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 70 http://localhost:8080/health.php || true)"
            if [ "$code" = 503 ]; then
              cat /tmp/health.json
              echo
              grep -q '"status":"unavailable"' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "/health.php did not report 503 after the database stopped (last HTTP $code)" >&2
          exit 1

      - name: Container logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
          docker logs bookwise-real 2>&1 || true

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f bookwise-real || true
          docker compose down -v
