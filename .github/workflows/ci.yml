name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.3 is the oldest supported version (composer.json).
        php: ['8.3', '8.4', '8.5']
        # MySQL 8.4 LTS for every PHP version (MySQL 8.0 reached its end of
        # life in April 2026).
        database: ['mysql:8.4']
        include:
          # MariaDB, the other supported server, on one PHP version.
          - php: '8.4'
            database: 'mariadb:11.4'

    services:
      database:
        image: ${{ matrix.database }}
        env:
          # The mysql image reads MYSQL_*; the mariadb image prefers MARIADB_* (equal values are fine).
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bookwise_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bookwise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ startsWith(matrix.database, 'mariadb') && 'mariadb-admin' || 'mysqladmin' }} ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: bookwise_test
      DB_USER: root
      DB_PASS: root
      # Database-backed suites must fail, not skip, if the database is unreachable.
      BOOKWISE_REQUIRE_DB: 1

    steps:
      # Actions are pinned to the commit of a release (named in the comment);
      # Dependabot proposes updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, fileinfo, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: PHP syntax check
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Tests
        run: composer test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: |
          for script in docker/entrypoint.sh tests/Docker/smoke.sh tests/Docker/entrypoint_test.sh; do
            bash -n "$script"
          done
          shellcheck --severity=warning docker/entrypoint.sh tests/Docker/smoke.sh tests/Docker/entrypoint_test.sh

      - name: Entrypoint configuration tests
        run: bash tests/Docker/entrypoint_test.sh

      - name: Build the image
        run: docker compose build

      - name: Start the store (MySQL + app in demo mode)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Wait for /health.php
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health.php; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "/health.php did not answer in time" >&2
          exit 1

      - name: The app runs as www-data
        run: test "$(docker compose exec -T app id -un)" = www-data

      - name: Smoke test
        env:
          BASE_URL: http://localhost:8080
        run: bash tests/Docker/smoke.sh

      - name: The order is stored as paid
        run: |
          status="$(docker compose exec -T db mysql -N -u bookwise -pbookwise-local-only bookwise \
            -e "SELECT status FROM orders ORDER BY id DESC LIMIT 1")"
          echo "latest order: $status"
          test "$status" = paid

      - name: The payment was simulated inside the application
        run: |
          # The in-process simulator keeps its state in storage/, writable by www-data.
          docker compose exec -T app sh -c 'test "$(stat -c %U storage/payment-simulator.json)" = www-data'
          docker compose exec -T app grep -q '"payment_status": "paid"' storage/payment-simulator.json

      - name: The local-only administrator password is refused on a public address
        run: |
          if output="$(docker compose run --rm --no-deps -T -e APP_URL=https://bookwise.example.com app 2>&1)"; then
            echo "the container started with the published administrator password on a public address" >&2
            exit 1
          fi
          echo "$output"
          grep -q 'not a local address' <<<"$output"

      - name: A real store refuses the payment simulator
        run: |
          if output="$(docker compose run --rm --no-deps -T -e APP_ENV=production -e APP_DEMO=false -e PAYMENT_SIMULATOR=true app 2>&1)"; then
            echo "the container started a real store with the payment simulator on" >&2
            exit 1
          fi
          echo "$output"
          grep -q 'Set PAYMENT_SIMULATOR=false' <<<"$output"

      - name: Without APP_DEMO there is no payment simulator (and PORT is honoured)
        run: |
          docker compose run -d --no-deps --name bookwise-real -p 8081:9090 \
            -e PORT=9090 -e APP_DEMO=false -e APP_URL=http://localhost:8081 \
            -e STRIPE_SECRET_KEY=sk_test_not_a_real_key -e STRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret \
            -e BOOKWISE_ADMIN_EMAIL= -e BOOKWISE_ADMIN_PASSWORD= \
            app
          for attempt in $(seq 1 60); do
            curl -fsS --max-time 5 http://localhost:8081/health.php && break
            sleep 2
          done
          echo
          curl -fsS --max-time 5 http://localhost:8081/health.php
          echo
          # pay.php also answers 404 for an unknown session while the simulator is on,
          # so the two are told apart by the simulator's own message, which the demo
          # store (port 8080) shows and the store without APP_DEMO must not.
          code="$(curl -s -o /tmp/pay-demo.html -w '%{http_code}' --max-time 5 'http://localhost:8080/pay.php?session=cs_test_x')"
          echo "pay.php with APP_DEMO: HTTP $code"
          test "$code" = 404
          grep -q 'This payment link is not valid.' /tmp/pay-demo.html
          code="$(curl -s -o /tmp/pay-real.html -w '%{http_code}' --max-time 5 'http://localhost:8081/pay.php?session=cs_test_x')"
          echo "pay.php without APP_DEMO: HTTP $code"
          test "$code" = 404
          if grep -q 'This payment link is not valid.' /tmp/pay-real.html; then
            echo "the payment simulator must be off without APP_DEMO" >&2
            exit 1
          fi
          # The application agrees, and a Stripe webhook is processed again (400: unsigned).
          docker exec bookwise-real php -r 'define("BOOKWISE_NO_SESSION", true); require "src/bootstrap.php"; exit(payment_simulator_enabled() ? 1 : 0);'
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST --data '{}' http://localhost:8081/stripe_webhook.php)"
          echo "stripe_webhook.php without APP_DEMO: HTTP $code"
          test "$code" = 400
          if curl -s --max-time 5 http://localhost:8081/Home_Page.php | grep -q 'demo-banner'; then
            echo "the demo banner must not be shown without APP_DEMO" >&2
            exit 1
          fi

      - name: /health.php reports an unavailable database
        run: |
          docker compose stop db
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 70 http://localhost:8080/health.php || true)"
            if [ "$code" = 503 ]; then
              cat /tmp/health.json
              echo
              grep -q '"status":"unavailable"' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "/health.php did not report 503 after the database stopped (last HTTP $code)" >&2
          exit 1

      - name: Container logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
          docker logs bookwise-real 2>&1 || true

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f bookwise-real || true
          docker compose down -v

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install the test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the image
        run: docker compose build

      # The demo store of docker-compose.yml: the payment simulator, the demo
      # inbox (MAIL_DRIVER=database) and the one-click demo accounts.
      - name: Start the store (MySQL + app in demo mode)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Wait for /health.php
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health.php; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "/health.php did not answer in time" >&2
          exit 1

      - name: Browser tests (Playwright with axe-core)
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Container logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

      - name: Stop the containers
        if: always()
        run: docker compose down -v
