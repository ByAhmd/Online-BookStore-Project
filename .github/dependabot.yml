# Weekly dependency updates. Minor and patch updates of each ecosystem come
# as one grouped pull request; major updates come one by one. CI runs on each
# pull request (.github/workflows/ci.yml).
version: 2
updates:
  # composer.json / composer.lock (resolved for PHP 8.3, see config.platform)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ['*']
        update-types: [minor, patch]

  # package.json / package-lock.json: the browser tests (Playwright with
  # axe-core, e2e/). package.json keeps playwright-core on the version of
  # @playwright/test ("overrides"), so an update of one moves both.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  # The actions in .github/workflows, pinned to commit SHAs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  # Base images of the Dockerfile (composer, php:*-apache)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The image runs the PHP version of the public demo (8.4, see
      # docs/DEPLOYMENT.md). PHP 8.5 builds OPcache into PHP itself, so the
      # Dockerfile's "docker-php-ext-install ... opcache" step has to change
      # first (an 8.5 image has not been built yet): moving the image to 8.5 is
      # a change of its own (Dockerfile, guide, tests), made by hand. CI already
      # tests the code on PHP 8.5.
      - dependency-name: php
        versions: ['>= 8.5']

  # Images of docker-compose.yml (the local MySQL)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The local database stays on MySQL 8.4 LTS, the version CI tests.
      # Later versions are short-lived innovation releases or a new LTS line;
      # moving to one is done by hand, together with the CI's database service.
      - dependency-name: mysql
        versions: ['>= 9']
