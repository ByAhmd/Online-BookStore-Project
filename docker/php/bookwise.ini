; PHP settings for the BookWise container, installed as
; /usr/local/etc/php/conf.d/zz-bookwise.ini on top of php.ini-production.

; Errors are logged (storage/logs/php-error.log once the app has started,
; the container output before that), never shown to visitors.
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On
expose_php = Off

; Profile pictures are limited to 2 MB by the application itself.
upload_max_filesize = 5M
post_max_size = 8M
memory_limit = 128M
max_execution_time = 30

; The code in the image never changes while the container runs.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

; The application sets its own timezone (APP_TIMEZONE); this only avoids
; warnings from code that runs before it does.
date.timezone = UTC
