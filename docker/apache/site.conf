# BookWise virtual host, installed as /etc/apache2/sites-enabled/bookwise.conf.
#
#  - Only public/ is served. The project root (src/, vendor/, storage/, bin/,
#    database/, docker/ ...) is denied as a second line of defence.
#  - The project's .htaccess files under public/ apply (AllowOverride All);
#    their essential rules are repeated here so they hold even without them.
#  - The demo's payment simulator needs nothing here: it runs inside the
#    application, and its payment page is the ordinary public/pay.php.

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/bookwise/public

    # Access log on stdout: no query strings (password-reset and other tokens
    # travel in URLs) and no health-check noise.
    SetEnvIf Request_URI "^/health\.php$" bookwise_skip_log
    LogFormat "%a \"%m %U %H\" %>s %B %Dus \"%{User-Agent}i\"" bookwise
    CustomLog ${APACHE_LOG_DIR}/access.log bookwise env=!bookwise_skip_log
    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Missing and denied URLs get the site's own (translated) error page. Only
    # for top-level URLs: the page links its styles and pages relatively, which
    # would not resolve below a sub-path such as /a/b (those keep Apache's page).
    <If "%{REQUEST_URI} !~ m#^/[^/]*/#">
        ErrorDocument 404 /not_found.php
        ErrorDocument 403 /not_found.php
    </If>

    # Static files get nosniff too (PHP pages already send it; not duplicated).
    <IfModule headers_module>
        Header setifempty X-Content-Type-Options "nosniff"
    </IfModule>

    # Browser caching of static files, as in public/.htaccess (PHP pages send
    # "Cache-Control: no-store" themselves): URLs versioned by asset()
    # (?v=<modification time>) for a year, uploads for an hour, other static
    # files (e.g. images referenced from CSS) for a day.
    <IfModule headers_module>
        <FilesMatch "\.(?i:css|js|png|jpe?g|gif|webp|svg|ico)$">
            Header set Cache-Control "public, max-age=86400"
            Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /^v=[0-9]+$/"
            Header set Cache-Control "public, max-age=3600" "expr=%{REQUEST_URI} =~ m#^/uploads/#"
        </FilesMatch>
    </IfModule>

    <Directory /var/www/bookwise>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/bookwise/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # Never serve dotfiles (.htaccess, a misplaced .env, ...).
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Uploaded files are data, never code.
    <Directory /var/www/bookwise/public/uploads>
        Options None
        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>
        <FilesMatch "\.(?i:php|phtml|phar|pht|php\d|shtml|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
